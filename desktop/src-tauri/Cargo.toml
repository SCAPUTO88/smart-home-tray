[package]
name = "smart-home-tray"
version = "0.1.0"
description = "Smart Home Tray desktop UI prototype"
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "smart_home_tray"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
