[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-tray-backend"
version = "0.1.0"
description = "Local-first Tuya LAN backend for Smart Home Tray"
requires-python = ">=3.12,<3.15"
dependencies = [
    "tinytuya>=1.20,<2",
    "psutil>=7,<8",
]

[project.scripts]
smart-home-tray = "smart_home_tray.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
