name: Backend tests

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend and test dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Run unit tests
        run: python -m pytest backend/tests -q
      - name: Compile backend and tests
        run: python -m compileall -q backend/src backend/tests
